{{- $fullName := include "txdc.fullname" . }}
{{- $dataLabels := include "txdc.dataplane.labels" . }}
{{- $dataEdcEndpoints := .Values.dataplane.endpoints }}
{{- $namespace := .Release.Namespace }}

{{- range .Values.dataplane.httpRoutes }}
{{- if and .enabled .endpoints }}
{{- $routeName := printf "%s-dataplane-%s" $fullName .hostname }}
{{- $annotations := .annotations | default dict }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $routeName }}
  namespace: {{ $namespace | default "default" | quote }}
  labels:
    {{- $dataLabels | nindent 4 }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .parentRefs }}
  parentRefs:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  hostnames:
    - {{ .hostname }}
  rules:
    {{- $routeEndpoints := .endpoints }}
    {{- range $name, $mapping := $dataEdcEndpoints }}
    {{- if (has $name $routeEndpoints) }}
    - matches:
        - path:
            type: PathPrefix
            value: {{ $mapping.path }}
      backendRefs:
        - name: {{ $fullName }}-dataplane
          port: {{ $mapping.port }}
          weight: 1
    {{- end }}
    {{- end }}
{{- end }}
{{- end }}
