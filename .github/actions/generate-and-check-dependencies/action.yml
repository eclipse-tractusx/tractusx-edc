name: "Generate and validate DEPENDENCIES"
description: "Generate and checks DEPENDENCIES file."

inputs:
  run:
    description: How the dependencies check must be applied. The "standard" will fail only for 'rejected' dependencies, "strict" will fail also for 'restricted' ones.
    required: false
    default: standard
  fail_on_out_of_date:
    description: Boolean indicating if the action should fail, if current DEPENDENCIES file is out of date. Default='false'
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Generate dependency list
      shell: bash
      run: |
        ./gradlew :edc-controlplane:allDependencies --configuration runtimeClasspath | grep -Poh "(?<=\s)[\w.-]+:[\w.-]+:[^:\s\[\]]+" > dependency-list-c
        ./gradlew :edc-dataplane:allDependencies --configuration runtimeClasspath | grep -Poh "(?<=\s)[\w.-]+:[\w.-]+:[^:\s\[\]]+" > dependency-list-d
        cat dependency-list-c dependency-list-d | sort | uniq > dependency-list
        cat dependency-list
        if [ ! -s dependency-list ]; then
          echo "ERROR: Generated dependency-list is empty!"
          exit 1
        fi

    - name: Verify existing DEPENDENCIES file is not empty
      shell: bash
      env:
        FAIL_ON_OUT_OF_DATE: ${{ inputs.fail_on_out_of_date }}
      run: |
        if [[ "$FAIL_ON_OUT_OF_DATE" == "true" ]]; then
          if [ ! -s DEPENDENCIES ]; then
            echo "ERROR: Existing DEPENDENCIES file is empty or does not exist!"
            exit 1
          fi
        fi

    - name: Run dash
      id: run-dash
      uses: eclipse-tractusx/sig-infra/.github/actions/run-dash@1a2be9d3b599c081a4a307d8124f33d209f7c54e # main
      with:
        dash_input: dependency-list
        dependencies_file: DEPENDENCIES
        fail_on_out_of_date: ${{ inputs.fail_on_out_of_date }}
        fail_on_rejected: true
        fail_on_restricted: ${{ inputs.run == 'strict' }}

    - name: Validate DEPENDENCIES file is not empty
      shell: bash
      run: |
        if [ ! -s DEPENDENCIES ]; then
          echo "ERROR: DEPENDENCIES file is empty or missing after running dash!"
          exit 1
        fi
        echo "DEPENDENCIES file is valid and non-empty ($(wc -l < DEPENDENCIES) lines)."

    - name: Print file
      shell: bash
      if: failure()
      run: |
        echo "=== Please copy the following content back to DEPENDENCIES ==="
        if [ -s DEPENDENCIES ]; then
          cat DEPENDENCIES
        else
          echo "No DEPENDENCIES file generated or file is empty."
        fi
        echo "=== end of content ==="
        exit 1
