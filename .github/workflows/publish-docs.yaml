---
# Builds the MkDocs documentation site (mkdocs.yml, docs/) on every pull request that
# touches it, and publishes it to GitHub Pages from main. It also runs when a release is
# published, so the changelog page (generated from GitHub Releases by
# resources/docs/hooks/release_notes.py) always lists the latest release.
#
# On pull requests the site is built for its preview address and uploaded with the pull
# request number; "Deploy documentation preview" (deploy-docs-preview.yaml) then publishes
# it to pr-preview/<number>/ and links it in the pull request. This workflow itself never
# gets write access on pull requests.
#
# The gh-pages branch is shared: it also serves the Helm repository (index.yaml), the
# Swagger UIs (openapi/), the JSON-LD contexts (context/), DEPENDENCIES and the Allure
# reports. .github/scripts/update-docs-gh-pages.sh therefore adds and overwrites files but
# never deletes them. Never switch this to `mkdocs gh-deploy --force`, which replaces the
# whole branch.
name: Publish documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'resources/docs/**'
      - '.github/workflows/publish-docs.yaml'
      - '.github/scripts/update-docs-gh-pages.sh'
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'resources/docs/**'
      - '.github/workflows/publish-docs.yaml'
      - '.github/workflows/deploy-docs-preview.yaml'
      - '.github/scripts/update-docs-gh-pages.sh'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A release event points at the tag; the site is always built from main.
          ref: ${{ github.event_name == 'release' && 'main' || '' }}
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install MkDocs
        run: pip install -r resources/docs/requirements.txt

      # --strict turns broken links, unknown anchors and pages missing from the nav into errors.
      # A pull request is built for its preview address, with a banner and noindex (mkdocs.yml).
      - name: Build site
        env:
          NO_MKDOCS_2_WARNING: '1'
          # Read-only token for the GitHub API (release notes); avoids the anonymous rate limit.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCS_PREVIEW_PR: ${{ github.event.pull_request.number }}
          DOCS_SITE_URL: >-
            ${{ github.event_name == 'pull_request'
            && format('https://eclipse-tractusx.github.io/tractusx-edc/pr-preview/{0}/', github.event.pull_request.number)
            || 'https://eclipse-tractusx.github.io/tractusx-edc/' }}
        run: mkdocs build --strict --site-dir site

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: documentation-site
          path: site
          retention-days: 7

      # Read by deploy-docs-preview.yaml, which treats it as untrusted and validates it.
      - name: Save pull request number
        if: github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          mkdir -p meta
          printf '%s' "${PR_NUMBER}" > meta/pr-number

      - if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-pr-number
          path: meta/pr-number
          retention-days: 7

  deploy:
    name: Publish to GitHub Pages
    needs: build
    if: >-
      github.repository == 'eclipse-tractusx/tractusx-edc' &&
      (github.event_name == 'release' || (github.event_name != 'pull_request' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-docs-gh-pages
      cancel-in-progress: false
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: documentation-site
          path: site

      - name: Check out deployment script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tools
          sparse-checkout: .github/scripts
          persist-credentials: false

      # Adds and overwrites, never deletes: the branch also holds the Helm index and more.
      - name: Deploy to GitHub Pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir "${RUNNER_TEMP}/gh-pages"
          cd "${RUNNER_TEMP}/gh-pages"
          bash "${GITHUB_WORKSPACE}/tools/.github/scripts/update-docs-gh-pages.sh" site "${GITHUB_WORKSPACE}/site"
