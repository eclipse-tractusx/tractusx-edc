---
# Builds the MkDocs documentation site (mkdocs.yml, docs/) on every pull request that
# touches it, and publishes it to GitHub Pages from main. It also runs when a release is
# published, so the changelog page (generated from GitHub Releases by
# resources/docs/hooks/release_notes.py) always lists the latest release.
#
# The gh-pages branch is shared: it also serves the Helm repository (index.yaml), the
# Swagger UIs (openapi/), the JSON-LD contexts (context/), DEPENDENCIES and the Allure
# reports. The deploy job therefore copies the site over a checkout of gh-pages, which adds
# and overwrites files but never deletes them, using only GitHub's own actions and git.
# Never switch this to `mkdocs gh-deploy --force`, which replaces the whole branch.
name: Publish documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'resources/docs/**'
      - '.github/workflows/publish-docs.yaml'
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'resources/docs/**'
      - '.github/workflows/publish-docs.yaml'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A release event points at the tag; the site is always built from main.
          ref: ${{ github.event_name == 'release' && 'main' || '' }}
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install MkDocs
        run: pip install -r resources/docs/requirements.txt

      # --strict turns broken links, unknown anchors and pages missing from the nav into errors.
      - name: Build site
        env:
          NO_MKDOCS_2_WARNING: '1'
          # Read-only token for the GitHub API (release notes); avoids the anonymous rate limit.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mkdocs build --strict --site-dir site

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: documentation-site
          path: site
          retention-days: 7

  deploy:
    name: Publish to GitHub Pages
    needs: build
    if: >-
      github.repository == 'eclipse-tractusx/tractusx-edc' &&
      (github.event_name == 'release' || (github.event_name != 'pull_request' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-docs-gh-pages
      cancel-in-progress: false
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: documentation-site
          path: site

      - name: Check out gh-pages
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          path: gh-pages
          fetch-depth: 1
          # Needed to push the site below; this job runs no code from the repository.
          persist-credentials: true

      - name: Deploy to GitHub Pages
        working-directory: gh-pages
        run: |
          # Add and overwrite, never delete: the branch also holds the Helm index and more.
          cp -R ../site/. .
          touch .nojekyll
          git add --all
          if git diff --cached --quiet; then
            echo "The documentation site is unchanged."
            exit 0
          fi
          # Set for the commit and for the rebase below, which rewrites it.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet --message "docs: publish documentation site (${GITHUB_SHA::7})"
          # Other workflows publish to gh-pages too; rebase onto theirs if one was faster.
          for attempt in 1 2 3; do
            git push --quiet origin HEAD:gh-pages && exit 0
            echo "Push rejected (attempt ${attempt}), rebasing onto the latest gh-pages."
            git pull --quiet --rebase origin gh-pages
          done
          exit 1
