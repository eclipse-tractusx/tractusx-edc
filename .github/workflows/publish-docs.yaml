---
# Builds the MkDocs documentation site (mkdocs.yml, docs/) on every pull request that
# touches it, and publishes it to GitHub Pages from main. It also runs when a release is
# published, so the changelog page (generated from GitHub Releases by
# resources/docs/hooks/release_notes.py) always lists the latest release.
#
# The gh-pages branch is shared: it also serves the Helm repository (index.yaml), the
# Swagger UIs (openapi/), the JSON-LD contexts (context/), DEPENDENCIES and the Allure
# reports. The site is therefore published with keep_files, which adds and overwrites
# files but never deletes them. Never switch this to `mkdocs gh-deploy --force`.
name: Publish documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'resources/docs/**'
      - '.github/workflows/publish-docs.yaml'
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'resources/docs/**'
      - '.github/workflows/publish-docs.yaml'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A release event points at the tag; the site is always built from main.
          ref: ${{ github.event_name == 'release' && 'main' || '' }}
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install MkDocs
        run: pip install -r resources/docs/requirements.txt

      # --strict turns broken links, unknown anchors and pages missing from the nav into errors.
      - name: Build site
        env:
          NO_MKDOCS_2_WARNING: '1'
          # Read-only token for the GitHub API (release notes); avoids the anonymous rate limit.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mkdocs build --strict --site-dir site

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: documentation-site
          path: site
          retention-days: 7

  deploy:
    name: Publish to GitHub Pages
    needs: build
    if: >-
      github.repository == 'eclipse-tractusx/tractusx-edc' &&
      (github.event_name == 'release' || (github.event_name != 'pull_request' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-docs-gh-pages
      cancel-in-progress: false
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: documentation-site
          path: site

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          keep_files: true
          commit_message: 'docs: publish documentation site'
