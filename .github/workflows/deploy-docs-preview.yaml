---
# Publishes the documentation preview of a pull request to
# https://eclipse-tractusx.github.io/tractusx-edc/pr-preview/<number>/ and links it in the
# pull request, in a comment that is updated on every new preview.
#
# "Publish documentation" (publish-docs.yaml) builds the site of a pull request without any
# write access, also for pull requests from forks, and uploads it with the pull request
# number. This workflow runs afterwards, from the default branch, with write access. It treats
# both artifacts as untrusted: the number must be the number of an open pull request whose
# head is the commit that was built, and the site is only copied into pr-preview/<number>/.
# Nothing from the pull request is executed here.
#
# cleanup-docs-preview.yaml removes the preview when the pull request is closed.
name: Deploy documentation preview

on:
  workflow_run:
    workflows: [Publish documentation]
    types: [completed]

permissions:
  contents: read

jobs:
  prepare:
    name: Check pull request
    if: >-
      github.repository == 'eclipse-tractusx/tractusx-edc' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pull-requests: read
    outputs:
      pr-number: ${{ steps.pr.outputs.number }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs-pr-number
          path: meta
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate pull request number
        id: pr
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const raw = fs.readFileSync('meta/pr-number', 'utf8').trim();
            if (!/^[1-9][0-9]{0,9}$/.test(raw)) {
              core.setFailed(`Invalid pull request number: ${JSON.stringify(raw.slice(0, 40))}`);
              return;
            }
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: Number(raw),
            });
            const headSha = context.payload.workflow_run.head_sha;
            if (pr.head.sha !== headSha) {
              core.notice(`Pull request #${raw} has moved on from ${headSha}; a newer build publishes its preview.`);
              return;
            }
            if (pr.state !== 'open') {
              core.notice(`Pull request #${raw} is ${pr.state}; no preview is published.`);
              return;
            }
            core.setOutput('number', raw);

  deploy:
    name: Publish preview
    needs: prepare
    if: needs.prepare.outputs.pr-number != ''
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      pull-requests: write
    # Shared with cleanup-docs-preview.yaml, so a preview is never published after its removal.
    concurrency:
      group: docs-preview-pr-${{ needs.prepare.outputs.pr-number }}
      cancel-in-progress: false
    env:
      PR_NUMBER: ${{ needs.prepare.outputs.pr-number }}
      PREVIEW_URL: https://eclipse-tractusx.github.io/tractusx-edc/pr-preview/${{ needs.prepare.outputs.pr-number }}/
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      # The script comes from the default branch, never from the pull request.
      - name: Check out deployment script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tools
          sparse-checkout: .github/scripts
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: documentation-site
          path: site
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # The pull request may have been closed while this run was waiting.
      - name: Check that the pull request is still open
        id: state
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: Number(process.env.PR_NUMBER),
            });
            const current = pr.state === 'open' && pr.head.sha === context.payload.workflow_run.head_sha;
            if (!current) core.notice(`Pull request #${process.env.PR_NUMBER} was closed or updated; skipping.`);
            core.setOutput('current', String(current));

      - name: Publish to gh-pages
        if: steps.state.outputs.current == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir "${RUNNER_TEMP}/gh-pages"
          cd "${RUNNER_TEMP}/gh-pages"
          bash "${GITHUB_WORKSPACE}/tools/.github/scripts/update-docs-gh-pages.sh" preview "${PR_NUMBER}" "${GITHUB_WORKSPACE}/site"

      - name: Link the preview in the pull request
        if: steps.state.outputs.current == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const marker = '<!-- docs-preview-comment -->';
            const sha = context.payload.workflow_run.head_sha;
            const body = [
              marker,
              '### Documentation preview',
              '',
              `The documentation of this pull request is published at **${process.env.PREVIEW_URL}**`,
              '',
              `Built from ${sha.slice(0, 7)}. GitHub Pages can take a minute or two to show it. The preview is ` +
                'updated on every push that changes the documentation and removed when the pull request is closed.',
            ].join('\n');
            const issue_number = Number(process.env.PR_NUMBER);
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner, repo: context.repo.repo, issue_number, per_page: 100,
            });
            const existing = comments.find(c => c.user?.type === 'Bot' && c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number, body,
              });
            }
