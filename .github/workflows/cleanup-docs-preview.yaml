---
# Removes the documentation preview of a pull request (pr-preview/<number>/ on gh-pages, see
# deploy-docs-preview.yaml) when the pull request is closed or merged, and says so in the
# preview comment.
#
# pull_request_target runs this workflow from the base branch: only the deployment script of
# the base branch is checked out, nothing from the pull request.
name: Remove documentation preview

on:
  pull_request_target:
    types: [closed]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'resources/docs/**'
      - '.github/workflows/publish-docs.yaml'
      - '.github/workflows/deploy-docs-preview.yaml'
      - '.github/scripts/update-docs-gh-pages.sh'

permissions:
  contents: read

jobs:
  remove:
    name: Remove preview
    if: github.repository == 'eclipse-tractusx/tractusx-edc'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    # Shared with deploy-docs-preview.yaml.
    concurrency:
      group: docs-preview-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Check out deployment script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tools
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Remove from gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir "${RUNNER_TEMP}/gh-pages"
          cd "${RUNNER_TEMP}/gh-pages"
          bash "${GITHUB_WORKSPACE}/tools/.github/scripts/update-docs-gh-pages.sh" remove "${PR_NUMBER}"

      - name: Update the preview comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const marker = '<!-- docs-preview-comment -->';
            const issue_number = Number(process.env.PR_NUMBER);
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner, repo: context.repo.repo, issue_number, per_page: 100,
            });
            const existing = comments.find(c => c.user?.type === 'Bot' && c.body?.includes(marker));
            if (!existing) return;
            const merged = context.payload.pull_request.merged;
            const body = [
              marker,
              '### Documentation preview',
              '',
              'The preview was removed because this pull request was closed.' +
                (merged ? ' The changes are on https://eclipse-tractusx.github.io/tractusx-edc/ once the site is published from main.' : ''),
            ].join('\n');
            await github.rest.issues.updateComment({
              owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body,
            });
