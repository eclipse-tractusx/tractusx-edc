  - Home:
      - Welcome: index.md
      - What is Tractus-X EDC?: home/overview.md
      - Why Tractus-X EDC?: home/why-tractusx-edc.md
      - Known friends: home/known-friends.md
      - Documentation map: home/documentation-map.md
      - Glossary: home/glossary.md
      - FAQ: home/faq.md
      - Get help: home/get-help.md
  - Architecture:
      - architecture/index.md
      - Components: architecture/components.md
      - Identity and trust: architecture/identity-and-trust.md
      - Catena-X policies: architecture/policies.md
      - Data exchange flows: architecture/flows.md
      - EDRs and token refresh: architecture/edr-and-token-refresh.md
      - Persistence and state: architecture/persistence.md
      - Deep dives:
          - Data plane signaling: development/dataplane-signaling/tx-signaling.extensions.md
          - Bidirectional data transfer: development/bidirectional-transfer/BidirectionalDataTransfer.md
      - Decision records (ADRs): development/decision-records/index.md
  - Dataspaces:
      - dataspaces/index.md
      - Create a dataspace extension: dataspaces/create-extension.md
  - Deployment:
      - deployment/index.md
      - Local quick start (kind): deployment/local-quickstart.md
      - Helm chart: deployment/helm-chart.md
      - Configuration: deployment/configuration.md
      - Platforms (AWS, Azure, …): deployment/platforms.md
      - Production checklist: deployment/production-checklist.md
      - Upgrades and migrations: deployment/upgrades.md
  - Tutorials:
      - tutorials/index.md
      - 1. Your first data exchange: tutorials/first-data-exchange.md
      - 2. Restrict access with BPN groups: tutorials/access-control-bpn-groups.md
      - 3. Consume data with EDRs: tutorials/consume-with-edrs.md
      - 4. Write your first extension: tutorials/first-extension.md
      - Integrations:
          - integrations/index.md
          - Amazon S3: integrations/aws-s3.md
          - Azure Blob Storage: integrations/azure-blob.md
      - Management API walkthrough:
          - usage/management-api-walkthrough/README.md
          - Assets: usage/management-api-walkthrough/01_assets.md
          - Policies: usage/management-api-walkthrough/02_policies.md
          - Contract definitions: usage/management-api-walkthrough/03_contractdefinitions.md
          - Catalog: usage/management-api-walkthrough/04_catalog.md
          - Contract negotiations: usage/management-api-walkthrough/05_contractnegotiations.md
          - Transfer processes: usage/management-api-walkthrough/06_transferprocesses.md
          - EDRs: usage/management-api-walkthrough/07_edrs.md
          - Contract agreements: usage/management-api-walkthrough/08_contractagreements.md
          - Response channels: usage/management-api-walkthrough/09_responsechannels.md
          - Non-finite provider push: usage/management-api-walkthrough/10_nonfiniteproviderpush/10_nonfiniteproviderpush.md
  - Developers:
      - developer/index.md
      - Development setup: developer/setup.md
      - Code architecture: developer/code-architecture.md
      - Writing extensions: developer/extensions.md
      - Testing: developer/testing.md
      - Contribution workflow: developer/contributing.md
      - AI-assisted development:
          - Connector Sensei: development/connector-sensei/README.md
          - How the skills work: development/connector-sensei/skills.md
          # "Skills" and one page per skill are added by resources/docs/hooks/sensei_skills.py.
      - Project guidelines:
          - Coding principles: development/coding-principles.md
          - Project structure: development/project-structure.md
          - Repository structure: development/repository-structure.md
          - Release process: development/release.md
  - Operations:
      - operations/index.md
      - Observability: operations/observability.md
      - Tune for production: operations/tuning.md
      - Troubleshooting: operations/troubleshooting.md
  - Reference:
      - reference/index.md
      - APIs: reference/apis.md
      - Extension catalogue: reference/extensions.md
      - JSON-LD and namespaces: reference/json-ld.md
      - Changelog: changelog/index.md
      - Migration guides: migration/index.md

