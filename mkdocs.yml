# Documentation site for Tractus-X EDC, published to GitHub Pages by
# .github/workflows/publish-docs.yaml. Build locally with:
#   pip install -r resources/docs/requirements.txt && mkdocs serve
# Look and feel follow the Tractus-X TestLab documentation
# (https://eclipse-tractusx.github.io/tractusx-testlab/).

site_name: Tractus-X EDC Documentation
site_description: >-
  Eclipse Tractus-X EDC: the Catena-X ready dataspace connector built on Eclipse
  Dataspace Components. Architecture, deployment, tutorials and developer guides.
# Pull request builds set DOCS_SITE_URL to their preview address (.github/workflows/publish-docs.yaml).
site_url: !ENV [DOCS_SITE_URL, 'https://eclipse-tractusx.github.io/tractusx-edc/']
repo_url: https://github.com/eclipse-tractusx/tractusx-edc
repo_name: eclipse-tractusx/tractusx-edc
edit_uri: edit/main/docs/

# The gh-pages branch is shared with the Helm repository index, the Swagger UIs,
# the JSON-LD contexts and the Allure reports. The site is therefore published
# additively; see the workflow before renaming any top-level section folder.
exclude_docs: |
  /README.md
  /overrides/
  /release-notes/

# Reachable through generated index pages or links, but not listed in the nav.
not_in_nav: |
  /development/README.md
  /development/connector-sensei/comment-template.md
  /development/decision-records/*/README.md
  /migration/*.md
  /usage/README.md

theme:
  name: material
  language: en
  custom_dir: docs/overrides
  favicon: assets/images/logo_tractus-x-min.ico
  logo: assets/images/logo_tractus-x.svg
  # No web fonts, neither bundled nor from a CDN: the stylesheet uses Manrope where it
  # is installed and the system UI font otherwise (fonts are not Apache-2.0/CC-BY-4.0).
  font: false
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    # Gold section tabs under the header, as on the TestLab documentation.
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.path
    - navigation.top
    - navigation.instant
    - navigation.tracking
    - navigation.indexes
    - navigation.footer
    - search.highlight
    - search.share
    - search.suggest
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - content.tabs.link
    - toc.follow

plugins:
  - search

hooks:
  - resources/docs/hooks/repo_links.py
  - resources/docs/hooks/generated_indexes.py
  - resources/docs/hooks/release_notes.py
  - resources/docs/hooks/sensei_skills.py
  - resources/docs/hooks/mermaid_theme.py

validation:
  omitted_files: warn
  absolute_links: info
  unrecognized_links: warn
  anchors: warn

extra_css:
  - assets/stylesheets/tractusx-edc.css

extra_javascript:
  - assets/javascripts/mermaid-zoom.js
  - assets/javascripts/tiles.js
  - assets/javascripts/external-links.js

extra:
  # "Ask Connector Sensei" button in the header (docs/overrides/partials/header.html).
  # Copilot on github.com takes the repository from ?repo= but has no URL parameter
  # for a custom agent (it reads only repo, model, prompt and autosubmit; checked
  # 2026-11), so the button opens Copilot on this repository and the reader picks the
  # Connector Sensei (.github/agents/connector-sensei.agent.md) in the agent menu.
  sensei:
    url: https://github.com/copilot?repo=eclipse-tractusx/tractusx-edc
    title: >-
      Ask the Connector Sensei, the Tractus-X EDC AI agent, on GitHub Copilot: Copilot opens on
      eclipse-tractusx/tractusx-edc; pick "Connector Sensei" in the agent menu of the prompt box
  # Used by resources/docs/hooks/repo_links.py to turn links that leave docs/ into
  # links to the source on GitHub.
  repo_branch: main
  # Set in pull request builds: a preview banner and noindex (docs/overrides/main.html).
  preview_pr: !ENV [DOCS_PREVIEW_PR, '']
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/eclipse-tractusx/tractusx-edc
      name: Tractus-X EDC on GitHub
    - icon: material/chat-question-outline
      link: https://github.com/eclipse-tractusx/tractusx-edc/discussions
      name: Discussions
    - icon: material/web
      link: https://eclipse-tractusx.github.io/
      name: Eclipse Tractus-X

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      # GitHub-compatible heading ids, so anchors written for github.com keep working.
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.keys
  - pymdownx.mark

